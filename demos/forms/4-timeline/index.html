<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案四 · 时间流 — 纸筏形态实验室</title>
<link rel="stylesheet" href="../core.css">
<style>
#flow {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: 62px; bottom: 56px; width: 500px;
  overflow-y: auto;
  padding: 6px 4px 20px;
  scroll-behavior: smooth;
}
#flow::-webkit-scrollbar { width: 5px; }
#flow::-webkit-scrollbar-thumb { background: rgba(90,110,150,.25); border-radius: 3px; }
.zone-head {
  font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #55638a;
  padding: 14px 6px 8px;
  display: flex; align-items: center; gap: 6px;
}
.zone-head .cnt {
  font-size: 10.5px; font-weight: 600; color: #7b88ab;
  background: rgba(90,110,150,.13);
  padding: 1px 7px; border-radius: 9px;
}
.zone > .note { position: static; margin-bottom: 10px; }
#flow .note { position: static; margin-bottom: 10px; }
#flow .note.card { width: 100%; }
#flow .note.board { width: 100%; }
#flow .note.strip { width: 100%; }
.tl-bar {
  position: absolute; top: 5px; right: 7px;
  display: flex; gap: 4px; z-index: 3;
}
.tl-btn {
  font-size: 12px; opacity: .3; cursor: pointer;
  transition: opacity .15s, transform .15s var(--spring);
  padding: 1px 2px;
}
.tl-btn:hover { opacity: .95; transform: scale(1.2); }
.tl-btn.pin.on { opacity: .9; }
.drawer-head { cursor: pointer; color: #7a6a5e; background: rgba(120,100,70,.1); border-radius: 8px; padding: 9px 12px; margin-bottom: 8px; letter-spacing: .5px; }
.drawer-head:hover { background: rgba(120,100,70,.16); }
.drawer-list .note.strip { margin-bottom: 6px; }
.drawer-more { font-size: 11px; color: #8a93a8; text-align: center; padding: 6px; }
.note.editing { outline: 2px solid #4c8bf5; outline-offset: 1px; cursor: text; }
</style>
</head>
<body>
<script src="../core.js"></script>
<script src="main.js"></script>
</body>
</html>
